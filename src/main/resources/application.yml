debug: true

logging:
  level:
    org.springframework.amqp.rabbit.core.RabbitAdmin: DEBUG
    org.springframework.amqp: DEBUG
    org.springframework.rabbit: DEBUG

server:
  port: ${ALERTA_PORT:8082}

spring:
  profiles:
    active: dev
  application:
    name: sistema_alertas
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 2s
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

app:
  monolito:
    base-url: ${MONOLITO_URL:http://localhost:8081}
  rabbitmq:
    exchange_name: ${EXCHANGE_NAME:exchange_alertas}
    queue_name: ${QUEUE_NAME:queue_alertas}
    routing_key_name: ${ROUTING_KEY_NAME:routing_key_alertas}
    email_queue_name: ${EMAIL_QUEUE_NAME:queue_email}
    email_routing_key_name: ${EMAIL_ROUTING_KEY_NAME:routing_key_email}
  alertas:
    vencimento:
      dias-antecedencia:
        - 30
        - 15
        - 7
    devolucao:
      limite-pendencia: 7
  email:
    remetente: ${EMAIL_REMETENTE:alertas@sistema.com}
    destinatario-fixo: ${EMAIL_DESTINATARIO:teste@exemplo.com}