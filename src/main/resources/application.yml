debug: true

logging:
  level:
    org.springframework.amqp.rabbit.core.RabbitAdmin: DEBUG
    org.springframework.amqp: DEBUG
    org.springframework.rabbit: DEBUG

server:
  port: ${ALERTA_PORT:8082}

spring:
  profiles:
    active: dev
  application:
    name: sistema_alertas
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin}

app:
  monolito:
    base-url: ${MONOLITO_URL:http://localhost:8081}
  rabbitmq:
    exchange_name: ${EXCHANGE_NAME:exchange_alertas}
    queue_name: ${QUEUE_NAME:queue_alertas}
    routing_key_name: ${ROUTING_KEY_NAME:routing_key_alertas}
  alertas:
    vencimento:
      dias-antecedencia:
        - 30
        - 15
        - 7
    devolucao:
      limite-pendencia: 7
